<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP - CampusKart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f3f6;
            font-family: 'Segoe UI', sans-serif;
        }
        .otp-box {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="otp-box">
        <h4 class="text-center mb-2">✅ Verify Your Email</h4>
        <p class="text-muted text-center">OTP bheja gaya hai teri college email pe!</p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="number" 
                   name="otp" 
                   class="form-control mb-3" 
                   placeholder="Enter 6-digit OTP" 
                   required>
            <button type="submit" class="btn btn-success w-100">
                Verify OTP
            </button>
        </form>

        <p class="text-center text-muted mt-3" style="font-size:13px">
            Wrong email? <a href="{% url 'register' %}">Go back</a>
        </p>
    </div>
</div>

</body>
</html>
